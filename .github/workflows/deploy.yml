name: Deploy to GitHub Pages

# ⚠️ 2026-10-05 起本 workflow 每次都失敗，且與本檔內容無關：
#   "The job was not started because your account is locked due to a billing issue."
#   runner 完全沒被分配（job 只跑約 2 秒、steps: []、runner_id: 0）。
#   處理 https://github.com/settings/billing 之後會自動恢復。
#   在那之前請改用手動部署（Pages 的 legacy 建置不受影響）：
#     GH_TOKEN=ghp_xxx npm run deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gh-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm run build 會先跑 scripts/fetch-tessdata.mjs 下載 OCR 語言包與
      # wasm 核心（這兩個目錄沒有進版控），所以 CI 要能連外網。
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 把 dist/ 內容直接推到 gh-pages 分支，Pages 的來源設成該分支。
      # base 由 vite.config.ts 依 GITHUB_REPOSITORY 自動判斷，這裡不用設定。
      - name: Publish to gh-pages
        run: |
          set -e
          cd dist
          touch .nojekyll
          git init -q
          git symbolic-ref HEAD refs/heads/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
